{% autoescape false %} {% set urlsplit = url | urlsplit %}

<!-- WB Insert -->
<script src="{{ static_prefix }}wombat.js"></script>
<script src="{{ static_prefix }}wombatSetup.js"></script>
<script>
  // Get the current url we are serving from.
  // We cannot know it at zim creation as it depends of our server.
  const current_url = (function () {
    var href = new URL(window.location.href);
    href.hash = '';

    return href.toString();
  })();

  // Every ZIM path is prefixed with REPLAY_MARKER (see
  // zimscraperlib.rewriting.url_rewriting.REPLAY_MARKER); stripping it from the
  // current document's own path before subtracting its length from current_url
  // keeps the marker as part of the computed prefix below instead of subtracting
  // it away, so wombat.js's own replay-prefix detection ("wb_rel_prefix") can
  // never again degenerate to '' or '/' (which corrupted any innerHTML/outerHTML
  // read on the page, see openzim/zimit#589) when a ZIM is served with no extra
  // "collection" path segment (e.g. a bare `kiwix.app/<path>`).
  const path = '{{ path }}'.startsWith(wombatSetup.REPLAY_MARKER)
    ? '{{ path }}'.slice(wombatSetup.REPLAY_MARKER.length)
    : '{{ path }}';

  const wbinfo = wombatSetup.getWombatInfo(
    current_url,
    '{{ orig_host }}',
    '{{ orig_scheme }}',
    '{{ orig_url }}',
    current_url.substring(0, current_url.length - path.length),
  );

  if (window && window._WBWombatInit) {
    window._WBWombatInit(wbinfo);
  }
</script>
{% endautoescape %}

<!-- End WB Insert -->
