name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  generate-rules:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
          architecture: x64

      - name: Install dependencies (and project)
        run: |
          pip install -U pip
          pip install -e .[scripts]

      - name: Generate rules
        run: |
          python rules/generate_rules.py

      - name: Save rules artifact
        uses: actions/upload-artifact@v7
        with:
          path: |
            src/zimscraperlib/rewriting/rules.py
            tests/rewriting/test_fuzzy_rules.py
            javascript/src/fuzzyRules.js
            javascript/test/fuzzyRules.js
          name: rules
          retention-days: 1

  check-extras-errors:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install test dependencies (and project)
        run: |
          pip install -U pip
          pip install -e '.[test,download]'

      - name: Check optional dependency errors
        run: pytest -q tests/test_extras.py

  check-extras:
    runs-on: ubuntu-26.04
    needs: generate-rules
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: none
            module: zimscraperlib
          - extra: zim
            module: zimscraperlib.zim
          - extra: image
            module: zimscraperlib.image
          - extra: video
            module: zimscraperlib.video
          - extra: download
            module: zimscraperlib.download
          - extra: filesystem
            module: zimscraperlib.filesystem
          - extra: html
            module: zimscraperlib.html
          - extra: rewriting
            module: zimscraperlib.rewriting.html
          - extra: i18n
            module: zimscraperlib.i18n

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Restore rules artifact
        uses: actions/download-artifact@v8
        with:
          name: rules

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies (and project)
        run: |
          pip install -U pip
          if [ "${{ matrix.extra }}" = "none" ]; then
            pip install -e .
          else
            pip install -e ".[${{ matrix.extra }}]"
          fi

      - name: Import module using only that extra
        run: python -c "import importlib; importlib.import_module('${{ matrix.module }}')"

  run-python-tests:
    runs-on: ubuntu-26.04
    needs: generate-rules

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Restore rules artifact
        uses: actions/download-artifact@v8
        with:
          name: rules

      - name: install ffmpeg and gifsicle
        run: sudo apt update && sudo apt install ffmpeg gifsicle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
          architecture: x64

      - name: Install dependencies (and project)
        run: |
          pip install -U pip
          pip install -e .[all,test,scripts]

      - name: Run the tests
        run: inv coverage --args "--runslow --runinstalled -vvv"

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Ensure we can build Python targets
        run: |
          pip install -U pip build
          python3 -m build --sdist --wheel

  run-js-tests:
    runs-on: ubuntu-26.04
    needs: generate-rules

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Restore rules artifact
        uses: actions/download-artifact@v8
        with:
          name: rules

      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version-file: 'javascript/package.json'

      - name: Enable corepack
        run: corepack enable

      - name: Install JS dependencies
        run: yarn install
        working-directory: javascript

      - name: Run JS tests
        working-directory: javascript
        run: yarn test

      - name: Ensure we can build development JS
        run: yarn build-dev
        working-directory: javascript

      - name: Ensure we can build production JS
        run: yarn build-prod
        working-directory: javascript

      - name: Ensure we can build JS package
        run: yarn pack
        working-directory: javascript

  build-docs: # validate that doc can be built
    runs-on: ubuntu-26.04
    needs: generate-rules

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
          architecture: x64

      - name: Install dependencies
        run: |
          pip install -U pip hatch

      - name: Build mkdoc documentation
        run: hatch run docs:build

      - name: Save doc artifact
        uses: actions/upload-artifact@v7
        with:
          path: |
            site/
          name: doc
          retention-days: 1
